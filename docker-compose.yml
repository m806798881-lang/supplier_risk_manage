services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_pass
      POSTGRES_DB: risk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://risk_user:risk_pass@db:5432/risk_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
