[project]
name = "week2-supplier-risk-valuate"
version = "0.1.0"
description = "供应商风险评估 API"
authors = [
    {name = "stella",email = "m806798881@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "bcrypt (==4.0.1)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "langchain-core (>=1.6.13,<2.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "week2_supplier_risk_valuate", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # 行长度由 Black 处理
